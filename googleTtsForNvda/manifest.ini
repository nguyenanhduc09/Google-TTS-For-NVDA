name = googleTtsForNvda
summary = "Google TTS For NVDA"
description = """Use Google's WASM text-to-speech voices locally as an NVDA synthesizer. The engine runs inside a speech runtime bundled with the add-on, so no web browser needs to be installed; Google Chrome, Microsoft Edge, and Brave remain available as alternative runtimes. Google TTS For NVDA is an independent, open-source accessibility project. It is not affiliated with, sponsored by, or endorsed by Google LLC. Google is a trademark of Google LLC."""
author = "Nguyen Anh Duc <ducna1803@gmail.com>, Dao Duc Trung <trung@ddt.one> and Pham Hung Vuong <hungvuong106206@gmail.com>"
url = https://github.com/nguyenanhduc09/Google-TTS-For-NVDA
version = 1.0
docFileName = readme.html
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.3.0
updateChannel = None
changelog = """Version 1.0:
- Added a bundled speech runtime: the WASM TTS engine now runs inside a Bun executable that ships with the add-on, so no web browser has to be installed. It is the default choice in the new Speech runtime setting, which lists the bundled runtime alongside Google Chrome, Microsoft Edge, and Brave.
- The add-on no longer requires a Chromium browser, an Edge WebView2 Runtime, or a browser user profile directory. Speech runs in a single background process, and the add-on falls back to an installed browser automatically if the bundled runtime is missing.
- Audio behaviour is unchanged: the browser and bundled runtimes share one copy of the synthesis harness, so gain, pitch, rate, pause shortening and packet timing are identical either way.
- Improved reading responsiveness for medium and long text with faster starts, smoother audio buffering, and reuse of completed audio held temporarily in RAM.
- Improved multilingual sentence and phrase breaks and the Use automatic language profiles feature using official Unicode 17.0 and CLDR 48.2 data.
- Increased default speech loudness and kept volume steadier without abnormal rises and falls. The Volume setting remains proportional. Distortion in some male voices comes from the original WASM TTS engine and is not addressed by this change.
- Improved recovery from failures in the speech runtime, WASM TTS engine, and NVDA audio output; prevented Keep Google TTS browser runtime ready in the background from retaining unhealthy runtimes; and reduced conflicts with other add-ons.
- Updated the bundled WASM TTS engine to version 20260917.1.
- Added Spanish and Brazilian Portuguese translations, and rewrote the Simplified Chinese translation using official NVDA terminology."""
