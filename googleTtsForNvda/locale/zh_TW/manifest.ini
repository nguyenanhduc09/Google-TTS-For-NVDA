summary = "Google TTS For NVDA"
description = """透過受支援的 Chromium 瀏覽器執行階段（例如 Google Chrome、Microsoft Edge 或 Brave），在本機使用 Google 的 WASM 文字轉語音（TTS）語音，作為 NVDA 的合成器。Google TTS For NVDA 是獨立的開放原始碼無障礙專案，與 Google LLC 並無隸屬關係，亦未獲得 Google LLC 贊助或背書。Google 是 Google LLC 的商標。"""
changelog = """版本 1.0:
- 改善中長文字的朗讀回應速度：優先產生較短的首段以更快開始朗讀，音訊緩衝更順暢，並重用暫存於 RAM 中已完成的語音音訊。
- 改善多語言的句子與片語斷句，並讓使用自動語言設定檔功能能借助官方 Unicode 17.0 與 CLDR 48.2 資料更準確地選出合適的設定檔。
- 提高預設語音音量，並讓音量更穩定，不再忽大忽小。音量設定仍保持比例。部分男聲的失真源自原始 WASM TTS 引擎本身，此變更不處理該問題。
- 改善 Chromium 瀏覽器執行階段、WASM TTS 引擎與 NVDA 音訊輸出發生失敗時的復原能力；讓在背景保持 Google TTS 瀏覽器執行階段就緒不再保留不健康的執行階段；並降低與其他附加元件衝突的情況。
- 將內建的 WASM TTS 引擎更新至 20260806.1 版。
- 新增西班牙文與巴西葡萄牙文翻譯，並依照 NVDA 官方術語重寫簡體中文翻譯。"""
